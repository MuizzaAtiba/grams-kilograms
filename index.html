<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grams-kilograms converter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="container">
            <h1>Grams into kilograms!</h1>
            <label for="grams">Enter the amount of grams:</label>
            <input type="number" id="grams" placeholder="e.g. 50">
            <button id="covertButton">Click to convert grams to kilograms</button>
            <p id="result"></p>
        </div>
        <script src="index.js"></script>
    </body>
</html>
